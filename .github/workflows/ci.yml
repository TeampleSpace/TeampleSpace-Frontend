name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: 배포용 정적 파일과 체크섬 생성
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/pdfjs/cmaps/UniKS-UTF16-H.bcmap
          release_dir="$RUNNER_TEMP/frontend-release"
          mkdir "$release_dir"
          file="frontend-$GITHUB_SHA.tar.gz"
          tar -czf "$release_dir/$file" -C dist .
          cd "$release_dir"
          tar -tzf "$file" > /dev/null
          sha256sum "$file" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: main 배포 후보 보관
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frontend-release/
          if-no-files-found: error
          compression-level: 0

  # 계약 복사본이 명시한 백엔드 커밋의 계약과 같은지 확인한다
  # 실패하면 contracts 폴더를 다시 복사해야 한다는 뜻이다
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: 계약 기준 읽기
        id: contract
        run: |
          ref="$(node -p 'require("./contracts-source.json").commit')"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: TeampleSpace/TeampleSpace-Backend
          ref: ${{ steps.contract.outputs.ref }}
          path: backend
      - run: BACKEND_DIR=backend BACKEND_REF=HEAD bash scripts/check-contracts.sh
